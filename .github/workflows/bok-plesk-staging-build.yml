name: BOK-PLESK-04 staging build verification

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/bok-plesk-01-runtime-prep

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: bokkie-staging-build
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://staging.bokkiecleaning.co.za
      NEXT_PUBLIC_BASE_URL: https://staging.bokkiecleaning.co.za
      PAYSTACK_PUBLIC_KEY: ${{ vars.PAYSTACK_PUBLIC_KEY }}
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ vars.PAYSTACK_PUBLIC_KEY }}
      BOKKIE_APP_ENV: staging
      EXPECTED_SUPABASE_REF: scsrxogumimsrtbnqeas
      BOKKIE_STAGING_OUTBOUND_DISABLED: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate staging build inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY PAYSTACK_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing staging setting::Configure $name in the bokkie-staging-build GitHub environment"
              exit 1
            fi
          done
          case "$PAYSTACK_PUBLIC_KEY" in
            pk_test_*) ;;
            *) echo "Staging requires a Paystack test public key"; exit 1 ;;
          esac
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://scsrxogumimsrtbnqeas.supabase.co"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run existing regression test
        run: npm run test:blog-sanitize

      - name: Test staging outbound guard
        run: npx tsx --test lib/staging-guards.test.ts

      - name: Build standalone Next.js
        run: npm run build

      - name: Verify standalone runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          test -d .next/static
          test -d public

      - name: Package runtime for verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          bash scripts/verify-plesk-runtime.sh .next/standalone
          tar -czf /tmp/bokkie-staging-standalone.tar.gz -C .next/standalone .

      - name: Upload runtime artifact (not deployed)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bokkie-staging-standalone
          path: /tmp/bokkie-staging-standalone.tar.gz
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish standalone to Plesk staging branch
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/bok-plesk-01-runtime-prep' && vars.BOKKIE_ENABLE_PLESK_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: bokkie-staging-build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bokkie-staging-standalone
          path: /tmp/bokkie-bundle

      - name: Verify artifact and publish without force push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s /tmp/bokkie-bundle/bokkie-staging-standalone.tar.gz
          mkdir -p /tmp/bokkie-deploy
          tar -xzf /tmp/bokkie-bundle/bokkie-staging-standalone.tar.gz -C /tmp/bokkie-deploy
          test -f /tmp/bokkie-deploy/server.js
          test -d /tmp/bokkie-deploy/.next/static
          test -d /tmp/bokkie-deploy/public
          test -f /tmp/bokkie-deploy/.next/BUILD_ID
          if find /tmp/bokkie-deploy -type f \( -name '.env' -o -name '.env.local' -o -name '.env.production' -o -name '*.pem' \) | grep -q .; then exit 1; fi
          mkdir -p /tmp/bokkie-publish
          cd /tmp/bokkie-publish
          git init
          git config user.name "bokkie-deploy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin deploy/staging
          git checkout -B deploy/staging FETCH_HEAD
          # Replace the existing tracked tree only after checking out the deploy branch.
          git ls-files -z | xargs -0 -r git rm -q -f --
          rsync -a --delete --exclude=.git/ /tmp/bokkie-deploy/ ./
          test -f server.js
          test -d .next/static
          test -d public
          printf '%s\n' "${SOURCE_SHA}" > RELEASE_SHA
          git add --all --force
          git diff --cached --quiet && { echo "No runtime change"; exit 0; }
          git commit -m "BOK-PLESK staging bundle from ${SOURCE_SHA}"
          git push origin HEAD:deploy/staging
